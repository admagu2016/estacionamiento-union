name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    name: Compilar para Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache de Buildozer (acelera compilaciones futuras)
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            .buildozer_global
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip openjdk-17-jdk-headless \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev libltdl-dev automake \
            build-essential ccache

      - name: Instalar Buildozer
        run: |
          pip install --upgrade pip
          pip install --upgrade cython buildozer

      - name: Compilar APK
        run: |
          yes | buildozer -v android debug

      - name: Subir el APK como resultado descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estacionamiento-union-apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: Subir logs si falló (para depurar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            .buildozer/android/platform/build-*/dists/*/build.log
            .buildozer/logs/*
          if-no-files-found: ignore
